<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Adam Mila</title>
  <desc id="desc">Software developer building web platforms, Linux tooling and interactive educational software. L2 Science and Technology student, University of Béjaïa, Algeria.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face { font-family: "Pix"; font-weight: 400; src: url(data:font/woff;base64,) format("woff"); }
      @font-face { font-family: "Pix"; font-weight: 700; src: url(data:font/woff;base64,) format("woff"); }
      .pix { font-family: "Pix", ui-monospace, monospace; }
      .breathe { animation: breathe 6s ease-in-out 2 alternate; }
      @keyframes breathe { from { opacity: .6; } to { opacity: 1; } }
      .rise { animation: rise .7s steps(6, end) backwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .cursor { animation: blink 1s steps(1) 5; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .rise, .cursor { animation: none; } }
    </style>
  </defs>

  <!-- soft background glow, fades to fully transparent before the edges -->
  <g class="breathe">
    <ellipse cx="420" cy="150" rx="420" ry="150" fill="url(#glowA)"/>
    <ellipse cx="960" cy="150" rx="240" ry="140" fill="url(#glowB)"/>
  </g>

  <!-- node graph motif: web · linux · education · systems -->
  <g stroke="#2f81f7" stroke-opacity="0.45" stroke-width="2" fill="none" shape-rendering="crispEdges">
    <path d="M884 82 L978 140 L1076 94 M978 140 L948 228 M978 140 L1090 204 M948 228 L1090 204 M884 82 L948 228"/>
  </g>
  <g fill="#0D1117" stroke-width="2" shape-rendering="crispEdges">
    <rect x="877" y="75" width="14" height="14" stroke="#2f81f7"/>
    <rect x="1069" y="87" width="14" height="14" stroke="#2f81f7"/>
    <rect x="941" y="221" width="14" height="14" stroke="#2f81f7"/>
    <rect x="1083" y="197" width="14" height="14" stroke="#2f81f7"/>
    <rect x="967" y="129" width="22" height="22" stroke="#00D9FF"/>
  </g>
  <rect x="973" y="135" width="10" height="10" fill="#00D9FF" shape-rendering="crispEdges"/>
  <g class="pix" font-size="15" fill="#8b949e">
    <text x="868" y="62">web</text>
    <text x="1056" y="76">linux</text>
    <text x="904" y="260">education</text>
    <text x="1058" y="234">systems</text>
  </g>

  <!-- text block -->
  <g class="pix rise d1" font-size="20">
    <text x="72" y="70" xml:space="preserve"><tspan fill="#00D9FF">adam@bejaia</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#c9d1d9">whoami</tspan></text>
    <rect class="cursor" x="314" y="54" width="11" height="19" fill="#00D9FF" shape-rendering="crispEdges"/>
  </g>
  <text class="pix rise d2" x="68" y="162" font-size="92" font-weight="700" fill="#e6edf3">Adam <tspan fill="url(#accent)">Mila</tspan></text>
  <rect class="rise d2" x="72" y="180" width="112" height="6" fill="url(#accent)" shape-rendering="crispEdges"/>
  <text class="pix rise d3" x="72" y="224" font-size="22" fill="#c9d1d9">Web platforms · Linux tooling · Interactive educational software</text>
  <text class="pix rise d4" x="72" y="262" font-size="18" fill="#8b949e">L2 Science &amp; Technology <tspan fill="#2f81f7">·</tspan> University of Béjaïa <tspan fill="#2f81f7">·</tspan> Akbou, Algeria</text>
</svg>
