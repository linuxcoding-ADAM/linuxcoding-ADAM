<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Adam Mila</title>
  <desc id="desc">Software developer building web platforms, Linux tooling and interactive educational software. L2 Science and Technology student, University of Béjaïa, Algeria.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D9FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2f81f7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="319" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .rise { animation: rise .7s ease-out backwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .cursor { animation: blink 1s steps(1) 4 forwards; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .rise { animation: none; } .cursor { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- node graph motif: platforms · tooling · education -->
    <g stroke="#2f81f7" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <path d="M884 92 L978 150 L1076 104 M978 150 L948 238 M978 150 L1090 214 M948 238 L1090 214 M884 92 L948 238"/>
    </g>
    <g fill="#0D1117" stroke-width="1.6">
      <circle cx="884" cy="92" r="7" stroke="#2f81f7"/>
      <circle cx="1076" cy="104" r="7" stroke="#2f81f7"/>
      <circle cx="948" cy="238" r="7" stroke="#2f81f7"/>
      <circle cx="1090" cy="214" r="7" stroke="#2f81f7"/>
      <circle cx="978" cy="150" r="11" stroke="#00D9FF"/>
    </g>
    <circle cx="978" cy="150" r="4" fill="#00D9FF"/>
    <g class="mono" font-size="12" fill="#8b949e" letter-spacing="0.5">
      <text x="868" y="74">web</text>
      <text x="1060" y="86">linux</text>
      <text x="912" y="266">education</text>
      <text x="1064" y="242">systems</text>
    </g>

    <!-- text block -->
    <g class="mono rise d1" font-size="18">
      <text x="72" y="86" xml:space="preserve"><tspan fill="#00D9FF">adam@bejaia</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#c9d1d9">whoami</tspan><tspan class="cursor" fill="#00D9FF"> ▋</tspan></text>
    </g>
    <text class="sans rise d2" x="68" y="164" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#e6edf3">Adam <tspan fill="url(#accent)">Mila</tspan></text>
    <rect class="rise d2" x="72" y="184" width="96" height="3" rx="1.5" fill="url(#accent)"/>
    <text class="sans rise d3" x="72" y="226" font-size="23" fill="#c9d1d9">Web platforms · Linux tooling · Interactive educational software</text>
    <text class="mono rise d4" x="72" y="266" font-size="15" fill="#8b949e" letter-spacing="0.3">L2 Science &amp; Technology <tspan fill="#2f81f7">·</tspan> University of Béjaïa <tspan fill="#2f81f7">·</tspan> Akbou, Algeria</text>

    <!-- one-time scan line -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" from="-80" to="320" dur="2.2s" begin="0.2s" fill="freeze"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#30363d"/>
</svg>
